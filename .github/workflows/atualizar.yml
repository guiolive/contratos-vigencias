name: Atualizar dados dos contratos

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 06h00 Brasília (09h00 UTC), dias úteis
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar contratos da API Compras.gov.br
        run: python atualizar.py

      - name: Commit se houver mudança
        run: |
          git config user.name "painel-bot"
          git config user.email "actions@github.com"
          git add dados.json
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%F)"
          # a rodada leva ~25 min: rebase pega commits feitos na main nesse meio-tempo
          git pull --rebase origin main
          git push

      - name: Publicar no Cloudflare (dlogproad.app/painel-contratos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN ausente — pulando publicação no Cloudflare"
            exit 0
          fi
          mkdir -p public/painel-contratos
          cp index.html manual.html dados.json public/painel-contratos/
          npx -y wrangler@4.124.0 deploy
