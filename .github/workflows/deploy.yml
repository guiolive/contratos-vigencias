name: Publicar no Cloudflare

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manual.html
      - dados.json
      - wrangler.jsonc
      - .github/workflows/deploy.yml
  workflow_run:
    # o commit do painel-bot usa o token padrão do Actions e não gera evento
    # de push, então o deploy também escuta o fim da carga diária
    workflows: ["Atualizar dados dos contratos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Publicar no Cloudflare (dlogproad.app/painel-contratos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN ausente, pulando publicação no Cloudflare"
            exit 0
          fi
          mkdir -p public/painel-contratos
          cp index.html manual.html dados.json public/painel-contratos/
          npx -y wrangler@4.124.0 deploy
